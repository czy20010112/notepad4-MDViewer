name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

defaults:
  run:
    shell: cmd

jobs:
  build:
    strategy:
      matrix:
        platform: [Win32, x64, ARM64]
    name: MSVC Release (${{ matrix.platform }})
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Update Version Hash
      run: |
        "c:/Program Files/Git/usr/bin/sed" -i "s/^\(.\+\)[0-9a-f]\{8\}\(.\+\)$/\1%GITHUB_SHA:~0,8%\2/gm" ./src/VersionRev.h ./matepath/src/VersionRev.h

    - name: MSVC ${{ matrix.platform }} Release
      run: |
        CALL "build\VisualStudio\build.bat" Build ${{ matrix.platform }} Release 1
        CALL "locale\build.bat" Build ${{ matrix.platform }} Release 1
        CALL "build\make_zip.bat" MSVC ${{ matrix.platform }} Release Locale 1

    - uses: actions/upload-artifact@v4
      with:
          name: Notepad4_MDViewer_i18n_${{ matrix.platform }}
          path: 'build\Notepad4_i18n_${{ matrix.platform }}_*.zip'
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/download-artifact@v4
      with:
          path: release
          merge-multiple: true

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" release/*.zip \
          --repo "${{ github.repository }}" \
          --title "Notepad4 MDViewer ${{ github.ref_name }}" \
          --notes "Markdown preview build of Notepad4 (upstream ${{ github.sha }}).

        - Markdown preview pane (mdviewer.net style) with GFM tables, task lists, strikethrough
        - LaTeX math via KaTeX, code highlighting via highlight.js, Mermaid diagrams (bundled offline)
        - Simplified Chinese UI (zh-Hans locale DLL included), font/file settings, PDF export
        - WebView2Loader.dll and MDPreviewAssets are bundled; the WebView2 Runtime is required (preinstalled on Windows 10/11)"

    - name: List release assets
      run: gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
      env:
        GH_TOKEN: ${{ github.token }}
